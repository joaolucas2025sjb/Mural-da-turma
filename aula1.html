<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mural da Turma</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background:#0a0f1f;
      color:white;
    }

    /* CABEÇALHO */
    header{
      background:#050816;
      padding:20px;
      border-bottom:3px solid #1e3a8a;
      box-shadow:0 0 15px rgba(30,58,138,0.4);
    }

    header h1{
      text-align:center;
      color:#60a5fa;
      margin-bottom:10px;
    }

    nav{
      display:flex;
      justify-content:center;
      gap:20px;
    }

    nav a{
      text-decoration:none;
      color:white;
      transition:0.3s;
      font-weight:bold;
    }

    nav a:hover{
      color:#60a5fa;
    }

    /* CONTEÚDO */
    main{
      width:90%;
      max-width:1000px;
      margin:30px auto;
    }

    section{
      margin-bottom:30px;
    }

    /* NOVA POSTAGEM */
    .nova-postagem{
      background:#111827;
      padding:25px;
      border-radius:15px;
      border:1px solid #1e3a8a;
      box-shadow:0 0 15px rgba(30,58,138,0.2);
    }

    .nova-postagem h2{
      color:#60a5fa;
      margin-bottom:15px;
    }

    textarea{
      width:100%;
      min-height:120px;
      padding:15px;
      border:none;
      border-radius:10px;
      background:#1f2937;
      color:white;
      resize:vertical;
      margin-bottom:15px;
      outline:none;
    }

    textarea::placeholder{
      color:#9ca3af;
    }

    input[type="file"]{
      margin-bottom:15px;
      color:white;
    }

    button{
      background:#1e3a8a;
      color:white;
      border:none;
      padding:12px 20px;
      border-radius:10px;
      cursor:pointer;
      transition:0.3s;
      font-weight:bold;
    }

    button:hover{
      background:#2563eb;
      transform:scale(1.03);
    }

    /* POSTS */
    .mural{
      display:flex;
      flex-direction:column;
      gap:25px;
    }

    .post{
      background:#111827;
      padding:20px;
      border-radius:15px;
      border-left:5px solid #2563eb;
      box-shadow:0 0 10px rgba(0,0,0,0.5);
    }

    .post p{
      margin-bottom:15px;
      line-height:1.5;
    }

    .post img{
      width:100%;
      max-height:400px;
      object-fit:cover;
      border-radius:10px;
      margin-bottom:15px;
    }

    .acoes{
      display:flex;
      align-items:center;
      gap:15px;
      margin-top:10px;
    }

    .curtidas{
      color:#60a5fa;
      font-weight:bold;
    }

    /* COMENTÁRIOS */
    .comentarios{
      margin-top:20px;
      padding-top:15px;
      border-top:1px solid #374151;
    }

    .comentarios input{
      width:100%;
      padding:12px;
      border:none;
      border-radius:10px;
      background:#1f2937;
      color:white;
      margin-bottom:10px;
      outline:none;
    }

    .comentarios input::placeholder{
      color:#9ca3af;
    }

    .comentario-item{
      background:#1f2937;
      padding:10px;
      border-radius:10px;
      margin-top:10px;
      border-left:3px solid #2563eb;
    }

    /* RODAPÉ */
    footer{
      background:#050816;
      padding:20px;
      text-align:center;
      border-top:3px solid #1e3a8a;
      margin-top:40px;
      color:#9ca3af;
    }

    /* RESPONSIVO */
    @media(max-width:700px){
      nav{
        flex-direction:column;
        align-items:center;
      }

      .acoes{
        flex-direction:column;
        align-items:flex-start;
      }
    }

  </style>
</head>

<body>

  <!-- CABEÇALHO -->
  <header>
    <h1>💬 Mural da Turma</h1>

    <nav>
      <a href="#">Início</a>
      <a href="#">Avisos</a>
      <a href="#">Discussões</a>
      <a href="#">Projetos</a>
      <a href="#">Contato</a>
    </nav>
  </header>

  <!-- CONTEÚDO -->
  <main>

    <!-- ÁREA DE PUBLICAÇÃO -->
    <section class="nova-postagem">
      <h2>Criar Publicação</h2>

      <textarea id="textoPost" placeholder="Compartilhe algo com a turma..."></textarea>

      <input type="file" id="imagemPost" accept="image/*">

      <br>

      <button onclick="criarPost()">Publicar</button>
    </section>

    <!-- MURAL -->
    <section class="mural" id="mural">
    </section>

  </main>

  <!-- RODAPÉ -->
  <footer>
    <p>© 2026 - Sistema do Mural da Turma</p>
  </footer>

  <script>

    function criarPost(){

      const texto = document.getElementById("textoPost").value;
      const imagemInput = document.getElementById("imagemPost");

      if(texto.trim() === "" && imagemInput.files.length === 0){
        alert("Digite algo ou envie uma imagem.");
        return;
      }

      const mural = document.getElementById("mural");

      // CRIAR POST
      const post = document.createElement("div");
      post.classList.add("post");

      // TEXTO
      const textoPost = document.createElement("p");
      textoPost.textContent = texto;

      // IMAGEM
      if(imagemInput.files.length > 0){

        const arquivo = imagemInput.files[0];
        const leitor = new FileReader();

        leitor.onload = function(e){

          const imagem = document.createElement("img");
          imagem.src = e.target.result;

          post.appendChild(imagem);
        }

        leitor.readAsDataURL(arquivo);
      }

      post.appendChild(textoPost);

      // CURTIDAS
      let likes = 0;

      const acoes = document.createElement("div");
      acoes.classList.add("acoes");

      const botaoCurtir = document.createElement("button");
      botaoCurtir.innerHTML = "👍 Curtir";

      const contador = document.createElement("span");
      contador.classList.add("curtidas");
      contador.textContent = likes + " curtidas";

      botaoCurtir.onclick = function(){
        likes++;
        contador.textContent = likes + " curtidas";
      }

      acoes.appendChild(botaoCurtir);
      acoes.appendChild(contador);

      post.appendChild(acoes);

      // COMENTÁRIOS
      const comentarios = document.createElement("div");
      comentarios.classList.add("comentarios");

      const inputComentario = document.createElement("input");
      inputComentario.placeholder = "Escreva um comentário...";

      const botaoComentar = document.createElement("button");
      botaoComentar.innerHTML = "Comentar";

      const listaComentarios = document.createElement("div");

      botaoComentar.onclick = function(){

        if(inputComentario.value.trim() !== ""){

          const comentario = document.createElement("div");
          comentario.classList.add("comentario-item");

          comentario.textContent = inputComentario.value;

          listaComentarios.appendChild(comentario);

          inputComentario.value = "";
        }
      }

      comentarios.appendChild(inputComentario);
      comentarios.appendChild(botaoComentar);
      comentarios.appendChild(listaComentarios);

      post.appendChild(comentarios);

      // ADICIONAR NO MURAL
      mural.prepend(post);

      // LIMPAR CAMPOS
      document.getElementById("textoPost").value = "";
      document.getElementById("imagemPost").value = "";
    }

  </script>

</body>
</html>
